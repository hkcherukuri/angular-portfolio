<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Redirect to index with hash for Angular SPA
    var l = window.location;
    var pathWithoutRepo = l.pathname.replace('/angular-portfolio', '').replace(/\/$/, '');
    if (pathWithoutRepo && pathWithoutRepo !== '/') {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/angular-portfolio/#' + pathWithoutRepo
      );
    } else {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/angular-portfolio/'
      );
    }
  </script>
</head>
<body>
</body>
</html>
